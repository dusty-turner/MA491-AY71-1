<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 470" width="400" height="470" role="img" aria-labelledby="t d">
  <title id="t">The Denominator — chest emblem</title>
  <desc id="d">A silver shield bearing the fraction one over D, split by a glowing fraction bar.</desc>

  <defs>
    <linearGradient id="metalGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="45%"  stop-color="#BEC7D3"/>
      <stop offset="100%" stop-color="#5B6A80"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#2D5299"/>
      <stop offset="50%"  stop-color="#DCE8F7"/>
      <stop offset="100%" stop-color="#2D5299"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#5182CC" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#5182CC" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5182CC" stop-opacity="0"/>
    </radialGradient>
    <filter id="arcGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ambient ember haze -->
  <ellipse cx="200" cy="238" rx="196" ry="212" fill="url(#glow)"/>

  <!-- radiating rays behind the shield -->
  <g opacity="0.22" stroke="#5182CC" stroke-width="3" stroke-linecap="round">
    <g transform="translate(200 238)">
      <line y1="-215" y2="-172"/>
      <line y1="-215" y2="-172" transform="rotate(30)"/>
      <line y1="-215" y2="-172" transform="rotate(60)"/>
      <line y1="-215" y2="-172" transform="rotate(90)"/>
      <line y1="-215" y2="-172" transform="rotate(120)"/>
      <line y1="-215" y2="-172" transform="rotate(150)"/>
      <line y1="-215" y2="-172" transform="rotate(180)"/>
      <line y1="-215" y2="-172" transform="rotate(210)"/>
      <line y1="-215" y2="-172" transform="rotate(240)"/>
      <line y1="-215" y2="-172" transform="rotate(270)"/>
      <line y1="-215" y2="-172" transform="rotate(300)"/>
      <line y1="-215" y2="-172" transform="rotate(330)"/>
    </g>
  </g>

  <!-- shield body -->
  <path d="M200 18 L372 80 L372 244 C372 348 300 420 200 452 C100 420 28 348 28 244 L28 80 Z"
        fill="#050E1D" stroke="url(#metalGrad)" stroke-width="9" stroke-linejoin="round"/>
  <path d="M200 44 L350 98 L350 242 C350 334 288 398 200 428 C112 398 50 334 50 242 L50 98 Z"
        fill="none" stroke="#5182CC" stroke-width="2.5" opacity="0.45"/>

  <!-- numerator: the 1 -->
  <path d="M196 96 L216 96 L216 208 L250 208 L250 238 L150 238 L150 208 L184 208 L184 132 L160 146 L146 120 Z"
        fill="url(#metalGrad)" filter="url(#softGlow)"/>

  <!-- the fraction bar: his signature -->
  <rect x="80" y="252" width="240" height="20" rx="10" fill="url(#barGrad)" filter="url(#arcGlow)"/>

  <!-- denominator: the D -->
  <path fill-rule="evenodd" fill="url(#metalGrad)" filter="url(#softGlow)"
        d="M150 288 L198 288 C234 288 256 310 256 342 C256 374 234 396 198 396 L150 396 Z
           M178 314 L198 314 C220 314 226 327 226 342 C226 357 220 370 198 370 L178 370 Z"/>
</svg>
